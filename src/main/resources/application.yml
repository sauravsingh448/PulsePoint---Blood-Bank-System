server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bloodbankdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    #url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Implement OAuth login
  security:
    oauth2:  # We are using external login providers like Google
      client:
        registration:  # This defines which login providers you are using like GOOGLE
          google:
            client-id:  ${PROJECT1_GOOGLE_CLIENT_ID}  #Identifies your app to Google
            client-secret: ${PROJECT1_GOOGLE_CLIENT_SECRET}
            scope:   #This defines what data you want from Google
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"  #“After login, where should user come back?”

  jpa:
    hibernate:
      ddl-auto: update   # auto create/update tables, use cautiously in prod
    show-sql: true       # logs SQL queries in console
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  application:
    name: bloodbank-project


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true




